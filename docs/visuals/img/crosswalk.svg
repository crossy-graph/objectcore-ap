<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1000" viewBox="0 0 1750 1000"><title>Super-properties and where they come from</title><rect width="1750" height="1000" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><text x="60" y="70" font-family="Fira Sans" font-size="36" font-weight="500" fill="#1f1f1d" text-anchor="start">Super-properties and their origin</text><text x="60" y="106" font-family="Fira Sans" font-size="20" font-weight="400" fill="#55544f" text-anchor="start">31 super-properties of the crosswalk, grouped by how the profile treats them</text><rect x="60" y="140" width="306" height="70" rx="10" fill="#e2e8f0" stroke="#000000" stroke-width="1.5"/><text x="213" y="173.5" font-family="Fira Sans" font-size="20" font-weight="500" fill="#000000" text-anchor="middle">Taken from DCAT-AP</text><text x="213" y="197.5" font-family="Fira Sans" font-size="16" font-weight="400" fill="#55544f" text-anchor="middle">10 super-properties</text><rect x="60" y="230" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="70" y="252" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-01 Title / designation</text><rect x="60" y="274" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="70" y="296" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-02 Description</text><rect x="60" y="318" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="70" y="340" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-04 Type / category</text><rect x="60" y="362" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="70" y="384" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-05 Language</text><rect x="60" y="406" width="306" height="58" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="70" y="428" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-09 Temporal coverage / time</text><text x="70" y="450" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">span</text><rect x="60" y="472" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="70" y="494" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-10 Issue and modification date</text><rect x="60" y="516" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="70" y="538" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-27 Relations between resources</text><rect x="60" y="560" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="70" y="582" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-28 Version and series</text><rect x="60" y="604" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="70" y="626" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-29 Conformance and quality</text><rect x="60" y="648" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="70" y="670" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-31 Catalogue record</text><rect x="391" y="140" width="306" height="70" rx="10" fill="#4c1d95" stroke="#000000" stroke-width="1.5"/><text x="544" y="173.5" font-family="Fira Sans" font-size="20" font-weight="500" fill="#ffffff" text-anchor="middle">Imported from DCAT-AP+</text><text x="544" y="197.5" font-family="Fira Sans" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">5 super-properties</text><rect x="391" y="230" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="401" y="252" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-14 Measures, quantities, units</text><rect x="391" y="274" width="306" height="58" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="401" y="296" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-17 Sampling, measurement,</text><text x="401" y="318" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">analysis</text><rect x="391" y="340" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="401" y="362" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-18 Entity under study</text><rect x="391" y="384" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="401" y="406" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-19 Instrument, method, plan</text><rect x="391" y="428" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="401" y="450" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-23 Digitisation</text><rect x="722" y="140" width="306" height="70" rx="10" fill="#166534" stroke="#000000" stroke-width="1.5"/><text x="875" y="173.5" font-family="Fira Sans" font-size="20" font-weight="500" fill="#ffffff" text-anchor="middle">Tightened (NFDI core)</text><text x="875" y="197.5" font-family="Fira Sans" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">4 super-properties</text><rect x="722" y="230" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="732" y="252" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-03 Identifier</text><rect x="722" y="274" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="732" y="296" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-06 Creator</text><rect x="722" y="318" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="732" y="340" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-25 Rights, licence, access</text><rect x="722" y="362" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="732" y="384" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-26 Distribution, format, access</text><rect x="1053" y="140" width="306" height="70" rx="10" fill="#9a3412" stroke="#000000" stroke-width="1.5"/><text x="1206" y="173.5" font-family="Fira Sans" font-size="20" font-weight="500" fill="#ffffff" text-anchor="middle">Extension</text><text x="1206" y="197.5" font-family="Fira Sans" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">11 super-properties</text><rect x="1053" y="230" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="1063" y="252" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-07 Publisher, keeper, contact</text><rect x="1053" y="274" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="1063" y="296" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-08 Agents with role</text><rect x="1053" y="318" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="1063" y="340" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-11 Spatial reference / place</text><rect x="1053" y="362" width="306" height="58" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="1063" y="384" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-12 Reference system and</text><text x="1063" y="406" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">accuracy</text><rect x="1053" y="428" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="1063" y="450" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-13 Material</text><rect x="1053" y="472" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="1063" y="494" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-15 Production / modification</text><rect x="1053" y="516" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="1063" y="538" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-16 Find / excavation</text><rect x="1053" y="560" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="1063" y="582" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-20 Conservation, condition</text><rect x="1053" y="604" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="1063" y="626" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-21 Acquisition, custody, move</text><rect x="1053" y="648" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="1063" y="670" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-22 Provenance research, evidence</text><rect x="1053" y="692" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="1063" y="714" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-24 Uncertainty and vagueness</text><rect x="1384" y="140" width="306" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="1537" y="173.5" font-family="Fira Sans" font-size="20" font-weight="500" fill="#000000" text-anchor="middle">Open</text><text x="1537" y="197.5" font-family="Fira Sans" font-size="16" font-weight="400" fill="#55544f" text-anchor="middle">1 super-properties</text><rect x="1384" y="230" width="306" height="36" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="1394" y="252" font-family="Fira Sans" font-size="17" font-weight="400" fill="#1f1f1d" text-anchor="start">SP-30 Software, service, teaching</text><text x="60" y="966" font-family="Fira Sans" font-size="16" font-weight="400" fill="#55544f" text-anchor="start">Source: data/crosswalk.csv. SP-30 (software, service, teaching material) waits until a community needs it.</text></svg>
