<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1000" viewBox="0 0 1750 1000"><title>From community to export</title><rect width="1750" height="1000" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><text x="60" y="70" font-family="Fira Sans" font-size="36" font-weight="500" fill="#1f1f1d" text-anchor="start">From community to DCAT-AP export</text><text x="60" y="106" font-family="Fira Sans" font-size="20" font-weight="400" fill="#55544f" text-anchor="start">Seven stages of ObjectCore-AP, with the numbers of the current build (release 0.1.0)</text><text x="60" y="172" font-family="Fira Sans" font-size="22" font-weight="500" fill="#9a3412" text-anchor="start">1  Communities</text><rect x="60" y="190" width="205" height="130" rx="10" fill="#e2e8f0" stroke="#000000" stroke-width="1.5"/><text x="162.5" y="264" font-family="Fira Sans" font-size="22" font-weight="500" fill="#000000" text-anchor="middle">4 task areas</text><text x="64" y="365" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">TA1 Documentation</text><text x="64" y="395" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">TA2 Collections</text><text x="64" y="425" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">TA3 Archaeometry</text><text x="64" y="455" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">TA4 Protecting</text><text x="64" y="485" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">MDSE, KuR-MDS,</text><text x="64" y="515" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">heritage records</text><text x="297.5" y="172" font-family="Fira Sans" font-size="22" font-weight="500" fill="#9a3412" text-anchor="start">2  Super-properties</text><rect x="297.5" y="190" width="205" height="130" rx="10" fill="#fbbf24" stroke="#000000" stroke-width="1.5"/><text x="400" y="264" font-family="Fira Sans" font-size="22" font-weight="500" fill="#000000" text-anchor="middle">31 SPs</text><line x1="267" y1="255" x2="295.5" y2="255" stroke="#000000" stroke-width="2.0" marker-end="url(#a)"/><text x="301.5" y="365" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">11 extensions</text><text x="301.5" y="395" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">10 taken from DCAT-AP</text><text x="301.5" y="425" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">5 from DCAT-AP+</text><text x="301.5" y="455" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">4 tightened</text><text x="301.5" y="485" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">1 open</text><text x="535" y="172" font-family="Fira Sans" font-size="22" font-weight="500" fill="#9a3412" text-anchor="start">3  Core</text><rect x="535" y="190" width="205" height="130" rx="10" fill="#166534" stroke="#000000" stroke-width="1.5"/><text x="637.5" y="264" font-family="Fira Sans" font-size="22" font-weight="500" fill="#ffffff" text-anchor="middle">Levels A, B, C</text><line x1="504.5" y1="255" x2="533" y2="255" stroke="#000000" stroke-width="2.0" marker-end="url(#a)"/><text x="539" y="365" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">A  dataset</text><text x="539" y="395" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">B  object</text><text x="539" y="425" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">C  event</text><text x="539" y="455" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">Core from the</text><text x="539" y="485" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">DCAT-AP family</text><text x="772.5" y="172" font-family="Fira Sans" font-size="22" font-weight="500" fill="#9a3412" text-anchor="start">4  Profile</text><rect x="772.5" y="190" width="205" height="130" rx="10" fill="#9a3412" stroke="#000000" stroke-width="1.5"/><text x="875" y="264" font-family="Fira Sans" font-size="22" font-weight="500" fill="#ffffff" text-anchor="middle">26 classes</text><line x1="742" y1="255" x2="770.5" y2="255" stroke="#000000" stroke-width="2.0" marker-end="url(#a)"/><text x="776.5" y="365" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">40 slots</text><text x="776.5" y="395" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">14 event classes</text><text x="776.5" y="425" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">LinkML profile on</text><text x="776.5" y="455" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">DCAT-AP+; CRM and</text><text x="776.5" y="485" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">its extensions</text><text x="1010" y="172" font-family="Fira Sans" font-size="22" font-weight="500" fill="#9a3412" text-anchor="start">5  Generated</text><rect x="1010" y="190" width="205" height="130" rx="10" fill="#4c1d95" stroke="#000000" stroke-width="1.5"/><text x="1112.5" y="264" font-family="Fira Sans" font-size="22" font-weight="500" fill="#ffffff" text-anchor="middle">dist/</text><line x1="979.5" y1="255" x2="1008" y2="255" stroke="#000000" stroke-width="2.0" marker-end="url(#a)"/><text x="1014" y="365" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">JSON Schema</text><text x="1014" y="395" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">SHACL (merged)</text><text x="1014" y="425" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">OWL</text><text x="1014" y="455" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">model.json</text><text x="1247.5" y="172" font-family="Fira Sans" font-size="22" font-weight="500" fill="#9a3412" text-anchor="start">6  Tests</text><rect x="1247.5" y="190" width="205" height="130" rx="10" fill="#166534" stroke="#000000" stroke-width="1.5"/><text x="1350" y="264" font-family="Fira Sans" font-size="22" font-weight="500" fill="#ffffff" text-anchor="middle">10 examples</text><line x1="1217" y1="255" x2="1245.5" y2="255" stroke="#000000" stroke-width="2.0" marker-end="url(#a)"/><text x="1251.5" y="365" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">5 of 5 valid conform</text><text x="1251.5" y="395" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">5 of 5 invalid rejected</text><text x="1251.5" y="425" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">SHACL, pyshacl</text><text x="1485" y="172" font-family="Fira Sans" font-size="22" font-weight="500" fill="#9a3412" text-anchor="start">7  Export</text><rect x="1485" y="190" width="205" height="130" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="1587.5" y="264" font-family="Fira Sans" font-size="22" font-weight="500" fill="#000000" text-anchor="middle">DCAT-AP 3.0.1</text><line x1="1454.5" y1="255" x2="1483" y2="255" stroke="#000000" stroke-width="2.0" marker-end="url(#a)"/><text x="1489" y="365" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">Every record is also a</text><text x="1489" y="395" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">dcat:Dataset</text><text x="1489" y="425" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">5 of 5 valid pass the</text><text x="1489" y="455" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">official SHACL</text><text x="1489" y="485" font-family="Fira Sans" font-size="18" font-weight="400" fill="#1f1f1d" text-anchor="start">(recorded)</text><rect x="60" y="560" width="1630" height="290" rx="10" fill="#f6f6f3" stroke="#d8d6ce" stroke-width="1"/><text x="84" y="600" font-family="Fira Sans" font-size="24" font-weight="500" fill="#1f1f1d" text-anchor="start">How the stages are produced</text><text x="84" y="642" font-family="Fira Sans" font-size="20" font-weight="500" fill="#9a3412" text-anchor="start">1 to 3</text><text x="170" y="642" font-family="Fira Sans" font-size="20" font-weight="400" fill="#1f1f1d" text-anchor="start">Workbook “ObjectCore-AP Arbeitsmatrix”: communities, super-properties, core levels, decisions B-01 to B-08.</text><text x="84" y="688" font-family="Fira Sans" font-size="20" font-weight="500" fill="#9a3412" text-anchor="start">4</text><text x="170" y="688" font-family="Fira Sans" font-size="20" font-weight="400" fill="#1f1f1d" text-anchor="start">src/objectcore_ap/schema/objectcore_ap.yaml is the single source of truth for the profile.</text><text x="84" y="734" font-family="Fira Sans" font-size="20" font-weight="500" fill="#9a3412" text-anchor="start">5</text><text x="170" y="734" font-family="Fira Sans" font-size="20" font-weight="400" fill="#1f1f1d" text-anchor="start">python main.py generate runs the LinkML generators and the SHACL post-processing.</text><text x="84" y="780" font-family="Fira Sans" font-size="20" font-weight="500" fill="#9a3412" text-anchor="start">6</text><text x="170" y="780" font-family="Fira Sans" font-size="20" font-weight="400" fill="#1f1f1d" text-anchor="start">python main.py test validates every example against the profile shapes.</text><text x="84" y="826" font-family="Fira Sans" font-size="20" font-weight="500" fill="#9a3412" text-anchor="start">7</text><text x="170" y="826" font-family="Fira Sans" font-size="20" font-weight="400" fill="#1f1f1d" text-anchor="start">Instances carry oc: and dcat: types, so the same RDF is valid DCAT-AP 3.0.1.</text><text x="60" y="966" font-family="Fira Sans" font-size="16" font-weight="400" fill="#55544f" text-anchor="start">Numbers are read from dist/model.json; the DCAT-AP 3.0.1 result is recorded in data/dcatap_results.json unless the test step runs with --dcatap.</text></svg>
